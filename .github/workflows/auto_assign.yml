#
# See https://github.com/marketplace/actions/auto-assign-action
#
name: 'Auto Assign'
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
    paths-ignore:
      - 'skycultures/**'

jobs:
  add-reviews:
    runs-on: ubuntu-latest
    if: "!contains(github.actor, 'transifex')"
    name: Add reviews
    steps:
      - uses: kentaro-m/auto-assign-action@0a2c53d3721e4c5cfcce6afd4014aecc337979f6 # v2.0.2
