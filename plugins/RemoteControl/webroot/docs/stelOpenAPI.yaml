openapi: 3.0.3
info:
  title: Stellarium RemoteControl API
  version: 1.1.4
  description: |
    Comprehensive interactive specification mapping the HTTP-based interface for the 
    Stellarium Astronomy Software RemoteControl plug-in.
    
    ### Interface Capabilities:
    * **Poll application state** with conditional modification parameter IDs.
    * **Manipulate the field of view** and look-at orientation vector coordinates.
    * **Search catalogs** and command embedded script playback.
servers:
  - url: http://localhost:8090/api
    description: Local Stellarium Instance
paths:
  /main/status:
    get:
      tags:
        - Main Service
      summary: Get Stellarium Application Status
      description: |
        Returns a comprehensive overview of the program's dynamic state. This operation can be polled every few moments to find out if some primary Stellarium state changed. It returns a JSON object with the following format:
        
                {
                    //current location information, see StelLocation
                    location : {
                        name,
                        role,
                        planet,
                        latitude,
                        longitude,
                        altitude,
                        country,
                        state,
                        landscapeKey
                    },
                    //current time information
                    time : {
                        jday,       //current Julian day
                        deltaT,     //current deltaT as determined by the current dT algorithm
                        gmtShift,   //the timezone shift to GMT
                        timeZone,   //the timezone name
                        utc,        //the time in UTC time zone as ISO8601 time string
                        local,      //the time in local time zone as ISO8601 time string
                        isTimeNow,  //if true, the Stellarium time equals the current real-world time
                        timerate    //the current time rate (in secs)
                    },
                    selectioninfo, //string that contains the information of the currently selected object, as returned by StelObject::getInfoString
                    view : {
                        fov     //current FOV
                    },
                 
                    //the following is only inserted if an actionId parameter was given
                    //see below for more info
                    actionChanges : {
                        id, //currently valid action id, the interface should update its own id to this value
                        changes : {
                                //a list of boolean actions that changed since the actionId parameter
                                <actionName> : <actionValue>
                        }
                    },
                    //the following is only inserted if an propId parameter was given
                    //see below for more info
                    propertyChanges : {
                        id, //currently valid prop id, the interface should update its own id to this value
                        changes : {
                                //a list of properties that changed since the propId parameter
                                <propName> : <propValue>
                        }
                    }
                }

        The actionChanges and propertyChanges sections allow a remote interface to track boolean StelAction and/or StelProperty changes. 
        On the initial poll, you should pass -2 as propId and actionId. 
        This indicates to the service that you want a full list of properties/actions and their current values. 
        When receiving the answer, you should set your local propId /actionId to the id contained in actionChanges and propertyChanges, and re-send it with the next request as parameter again. 
        This allows the MainService to find out which changes must be sent to you (it maintains a queue of action/property changes internally, 
        incrementing the ID with each change), and you only have to process the differences instead of everything.
        
        To prevent heavy payload tracking, optional synchronization array filters can be passed 
        so the payload contains information changes only relative to your last known state.
      parameters:
        - name: actionId
          in: query
          required: false
          description: |
            Pass an integer tracking index sequence identifier. 
            If provided, the system returns execution status changes only since this reference ID.
          schema:
            type: integer
        - name: propId
          in: query
          required: false
          description: |
            Pass an integer property state sync reference value.
            Filters the `stelproperties` block to only expose keys modified since that operation index.
          schema:
            type: integer
      responses:
        '200':
          description: Successful state summary JSON payload representation
          content:
            application/json:
              schema:
                type: object

  /main/plugins:
    get:
      tags:
        - Main Service
      summary: Retrieve list of installed plugins
      description: |
        Returns the list of all known plugins, as a JSON object of format:
        
                {
                    //list of known plugins, in format:
                    <pluginName> : {
                        loadAtStartup,  //if to load the plugin at startup
                        loaded,     //if the plugin is currently loaded
                        //corresponds to the StelPluginInfo of the plugin
                        info : {
                                authors,
                                contact,
                                description,
                                displayedName,
                                startByDefault,
                                version
                        }
                    }
                }

      responses:
        '200':
          description: Dictionary map indexing installed plugins



  /main/view:
    get:
      tags:
        - Main Service
      summary: Get Current View Coordinates (AltAz / RA-Dec)
      description: |
        Returns the 3D view direction vector.
        Includes azimuthal coordinates, right ascension, declination.
        
            {
              //list of view directions, in format:
              "j2000" : "[x,y,z]",
              "jNow"  : "[x,y,z]",
              "altAz" : "[x,y,z]"
            }

        Without the optional coord, all versions are returned. The returned values are 3D vectors.
        
        |                   |
        |-------------------|
        | x  = cos(δ)*cos(α)|
        | y  = cos(δ)*sin(α)|
        | z  = sin(δ)       |
        
        For the vector in altAz system, the actually returned values are based on an azimuth Az' counted from South (x=1) towards East (y=1), Az'=180-Az.
        
        |                      |
        |----------------------|
        | x = cos(alt)*cos(Az')|
        | y = cos(alt)*sin(Az')|
        | z = sin(alt)         |
        

      parameters:
        - name: coord
          in: query
          required: false
          description: Limit answer to requested. One of "j2000", "jNow", "altAz"
          schema:
            type: string
        - name: ref
          in: query
          required: false
          description: |
            governs refraction setting (applies to the jNow output only!). 
            "On" applies refraction, "off" does not apply, and "auto" (or any other value) applies it when atmosphere setting is active.
          schema:
            type: string
      responses:
        '200':
          description: Looking vectors coordinates returned successfully
          content:
            application/json:
              schema:
                type: object
    post:
      tags:
        - Main Service
      summary: Update View direction (3D vector)
      description: |
        Directly alters the view direction. Use one of j2000, jNow or altAz. jNow can have a ref parameter.
        For efficiency, the calling program is required to prepare 3D vectors, not just provide angles.
        Alternatively, alt and az can be given directly (and should then provide both!).
                
        |                   |
        |-------------------|
        | x  = cos(δ)*cos(α)|
        | y  = cos(δ)*sin(α)|
        | z  = sin(δ)       |
        
        For the vector in altAz system, the values are based on an azimuth Az' counted from South (x=1) towards East (y=1), Az'=180-Az:
        
        |                      |
        |----------------------|
        | x = cos(alt)*cos(Az')|
        | y = cos(alt)*sin(Az')|
        | z = sin(alt)         |
        
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                ref: 
                  type: string
                  description: provided jNow coordinates to be understood as including refraction. 'on'/'off'/'auto' (or anything else; default.)
                j2000:
                  type: array
                  description: 3D view vector [x, y, z] in J2000 frame.
                  items:
                    type: number
                  maxItems: 3
                  minItems: 3
                jNow:
                  type: array
                  description: 3D view vector [x, y, z] in JNow frame.
                  items:
                    type: number
                  maxItems: 3
                  minItems: 3
                altAz:
                  type: array
                  description: 3D view vector in [x, y, z] alt/azimuthal frame.
                  items:
                    type: number
                  maxItems: 3
                  minItems: 3
                az: 
                  type: number
                  description: azimuth, degrees.
                alt: 
                  type: number
                  description: altitude above mathematical horizon, degrees.
      responses:
        '200':
          description: Camera matrix adjusted safely
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /main/fov:
    post:
      tags:
        - Main Service
      summary: Update field of view
      description: |
        Directly alters the field of view.
        Parameters can control smooth zooming.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                fov:
                  type: number
                  description: Vertical field of view measured in degrees.
      responses:
        '200':
          description: Field of view adjusted.
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /main/window:
    post:
      tags:
        - Main Service
      summary: Update window size
      description: |
        Modifies window size (if not fullscreen).
        This can be useful e.g. when Stellarium provides image background inserts via spout.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                w:
                  type: integer
                  description: Width, horizontal window size in pixels.
                h:
                  type: integer
                  description: Height, vertical window size in pixels.
      responses:
        '200':
          description: Window size adjusted.
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /main/move:
    post:
      tags:
        - Main Service
      summary: Update view direction
      description: |
        Interface for interactive moves.
        Allows viewport movement, like using the arrow keys in the main program. 
        This allows interfaces to create a "virtual joystick" to move the view manually. 
        This operation defines the intended move direction. 
        x and y define the intended move speed in azimuth and altitude (i.e. a negative x means left). Values of +-1.0 correspond to the same speed as used for the arrow keys. 
        This operation works in conjunction with the update() method - until the movement is stopped 
        (i.e. x and y are zero), or no move command has been received for a specified time 
        (about a second), the movement is performed in the given directions.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                x:
                  type: number
                  description: Movement speed in horizontal direction. Negative turns left.
                y:
                  type: number
                  description: Movement speed in vertical direction. Negative turns down.
      responses:
        '200':
          description: View direction changed.
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /main/time:
    post:
      tags:
        - Main Service
      summary: Modify Application Simulation Time
      description: Changes the simulation time or clock speed inside the engine.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                time:
                  type: number
                  description: Julian day number [float] (J2000.0 = 2451545.0).
                timerate:
                  type: number
                  description: Rate multiplier step value, [days/second] (1.15740740740740740740e-5 for real-time speed; 0 stops, negative reverses).
      responses:
        '200':
          description: Simulation clock updated


  /main/focus:
    post:
      tags:
        - Main Service
      summary: Set current app focus/selection
      description: |
        If no parameters are given, the current selection is cleared. 
        If the target parameter was given, the object to be selected is 
        looked up by name (first the localized name is tried, then the english name). 
        If the optional mode parameter is given, it determines how to change the view:
        
        - The default is 'center' which selects the object and moves it into the view's center. 
        - If it is set to 'zoom', it automatically zooms in on the object (StelMovementMgr::autoZoomIn) 
          on selection and automatically zooms out when the selection is cleared. 
        - If it is set to 'mark', the selection is just marked, but no view adjustment is done. 
        
        If the position parameter is used, it is interpreted as a coordinate in the J2000 frame, 
        and focused using StelMovementMgr::moveToJ2000. The mode parameter has no effect here. 
                        
        |                   |
        |-------------------|
        | x  = cos(δ)*cos(α)|
        | y  = cos(δ)*sin(α)|
        | z  = sin(δ)       |
         
        The target parameter takes precedence over the position parameter, if both are given.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                target:
                  type: string
                  description: Name of a celestial object inside Stellarium.
                mode:
                  type: string
                  description: Only valid when target is given. One of center|zoom|mark
                position:
                  type: array
                  description: 3D vector [x, y, z] in J2000 frame.
                  items:
                    type: number
                  maxItems: 3
                  minItems: 3
      responses:
        '200':
          description: Focus/selection changed



  /objects/find:
    get:
      tags:
        - Object Service
      summary: Query and Match Sky Objects
      description: |
        Finds objects which match the search string str, which may contain greek/unicode characters 
        like in the SearchDialog. Returns a JSON String array of search matches.
      parameters:
        - name: str
          in: query
          required: true
          description: Search term identifier parameter (e.g., 'Mars', 'M45').
          schema:
            type: string
      responses:
        '200':
          description: JSON Array listing catalog identifiers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /objects/info:
    get:
      tags:
        - Object Service
      summary: Get Selected Object Data
      description: |
        Exposes names, magnitudes, absolute angular size, position, distance, coordinates, 
        and classification arrays for the item currently selected (if called without parameters) or 
        the object with given name.
      parameters:
        - name: name
          in: query
          required: false
          description: Search term identifier parameter (e.g., 'Mars', 'M45').
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: one of 'json' or 'map' to provide JSON, any other or none for a HTML table.
          schema:
            type: string
      responses:
        '200':
          description: Object data map (JSON or HTML as requested).
          content:
            application/json:
              schema:
                type: object

  /objects/listobjecttypes:
    get:
      tags:
        - Object Service
      summary: List all available object types.
      description: |
        Returns all object types available in the internal catalogs as a JSON array of objects of format

            {
                key,    //the internal key for the object type
                name,   //the english name of the type
                name_i18n //the type name in the current language
            }
      responses:
        '200':
          description: Object data map (JSON or HTML as requested).
          content:
            application/json:
              schema:
                type: object


  /objects/listobjectsbytype:
    get:
      tags:
        - Object Service
      summary: Get Object Data of specified type.
      description: |
        Returns all objects of the specified type. 
        If english is given and it evaluates to a "true" value, the english names will be returned,
        otherwise the localized names will be returned. Returns a JSON string array.

      parameters:
        - name: type
          in: query
          required: true
          description: |
            Type identifier as listed in the 'key' entry in the 
            list retrieved by /objects/listobjecttypes, e.g. "SolarSystem:comet" or "NebulaMgr:11".
          schema:
            type: string
        - name: english
          in: query
          required: false
          description: Returns english names if true, otherwise localized names.
          schema:
            type: string
      responses:
        '200':
          description: List has been delivered.
          content:
            application/json:
              schema:
                type: object


  /view/listlandscape:
    get:
      tags:
        - View Service
      summary: Retrieve Landscapes Collection List
      description: Returns all scenery landscape environment profiles registered inside this build instance.
      responses:
        '200':
          description: Dictionary map indexing landscape parameters

  /view/listskyculture:
    get:
      tags:
        - View Service
      summary: Retrieve Sky Cultures Collection List
      description: Returns historical constellation profiles installed.
      responses:
        '200':
          description: Array mapping active historical sky culture keys

  /location/search:
    get:
      tags:
        - Location Service
      summary: Query Available City and Observation Locations
      description: Scans the integrated city coordinate directory databases.
      parameters:
        - name: str
          in: query
          required: true
          description: City title keyword context string
          schema:
            type: string
      responses:
        '200':
          description: Location name collection

  /scripts/list:
    get:
      tags:
        - Script Service
      summary: List Available Embedded Automation Scripts
      description: Scans the internal scripts folders and lists runable script items.
      responses:
        '200':
          description: List of script filenames

  /scripts/run:
    post:
      tags:
        - Script Service
      summary: Execute Named Macro Script Instance
      description: Dispatches an automation task processing runner instance matching the file criteria name key.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Exact filename (e.g., sky_tours.ssc).
      responses:
        '200':
          description: Script pipeline initialization successful

  /stelaction/do:
    post:
      tags:
        - Action Service
      summary: Trigger a Built-in Key Action (StelAction)
      description: Triggers standard hotkey macro shortcuts mapped to internal UI toggles.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: System toggle shortcut name string reference key (e.g., 'actionShow_Atmosphere').
      responses:
        '200':
          description: Shortcut method fired

  /stelproperty/set:
    post:
      tags:
        - Property Service
      summary: Modify Global Framework Properties (StelProperty)
      description: Directly manipulates system engine states, toggling specific viewing configuration parameters.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Property state layout parameter string identifier key.
                value:
                  type: string
                  description: String representation target configuration state value.
      responses:
        '200':
          description: Variable state overwritten cleanly
